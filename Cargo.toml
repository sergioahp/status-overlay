[package]
name = "status-overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4-layer-shell = "0.8.0"
gio = "0.22.8"
gtk = { package = "gtk4", version = "0.11.4" }
glib = "0.22.8"
chrono = "0.4.45"
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.3.0"
libc = "0.2.186"
async-channel = "2.5.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
rusqlite = "0.39.0"
