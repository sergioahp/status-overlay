[package]
name = "status-overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4-layer-shell = "0.5.0"
gio = "0.20.12"
gtk = { package = "gtk4", version = "0.9.7" }
glib = "0.20.12"
chrono = "0.4.45"
chrono-tz = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "2.12.1", features = ["tls"] }
libc = "0.2.186"
async-channel = "2.5.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
rusqlite = "0.31.0"
